
name: VERSUM ERP - CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VERSUM.KitchenWareERP.csproj

      - name: Build Project
        run: dotnet build VERSUM.KitchenWareERP.csproj --configuration Release --no-restore

      - name: Run Tests
        run: |
          if find . -name '*Tests.csproj' -print -quit | grep -q .; then
            dotnet test --configuration Release
          else
            echo "No automated test project found. Skipping tests."
          fi
